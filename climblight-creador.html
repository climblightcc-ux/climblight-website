<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Climblight — Mi panel de creador</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#1B3A5C; --navy-d:#122840; --navy-l:#254E7A; --navy-bg:#EFF4FA;
  --white:#FFFFFF; --off:#F8F9FA; --ink:#111827;
  --gray:#6B7280; --gray-l:#9CA3AF; --border:#E5E7EB;
  --green:#1D9E75; --green-bg:#E8F8F1;
  --gold:#B8862B; --gold-bg:#FBF3E1;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--off);color:var(--ink);font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:60px}

.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.tb-logo{font-family:'DM Serif Display',serif;font-size:18px;color:var(--navy)}
.tb-tag{font-size:10px;color:var(--gray-l);letter-spacing:.08em;text-transform:uppercase}

.wrap{max-width:720px;margin:0 auto;padding:24px 16px;display:flex;flex-direction:column;gap:16px}

.state{text-align:center;padding:70px 20px;color:var(--gray)}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.state-title{font-family:'DM Serif Display',serif;font-size:18px;color:var(--ink);margin-bottom:6px}

.card{background:var(--white);border:1px solid var(--border);border-radius:18px;padding:22px}
.card-label{font-size:10px;font-weight:700;color:var(--gray-l);letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px}

/* HEADER CREADOR */
.hero-card{display:flex;align-items:center;gap:16px}
.hero-photo{width:64px;height:64px;border-radius:16px;background:var(--navy-bg);color:var(--navy);display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:22px;overflow:hidden;flex-shrink:0}
.hero-photo img{width:100%;height:100%;object-fit:cover}
.hero-name{font-family:'DM Serif Display',serif;font-size:21px;color:var(--ink);letter-spacing:-.3px}
.hero-meta{font-size:12px;color:var(--gray);margin-top:2px}
.tier-pill{display:inline-block;padding:4px 12px;border-radius:100px;font-size:10.5px;font-weight:700;margin-top:8px}
.tier-base{background:var(--off);color:var(--gray)}
.tier-activo{background:var(--navy-bg);color:var(--navy)}
.tier-top{background:var(--navy);color:white}
.tier-elite{background:var(--gold-bg);color:var(--gold)}

/* SCORE */
.score-flex{display:flex;align-items:center;gap:20px;margin-bottom:18px}
.score-txt-tier{font-family:'DM Serif Display',serif;font-style:italic;font-size:17px;color:var(--navy)}
.score-txt-sub{font-size:12px;color:var(--gray);margin-top:2px}
.sb-rows{display:flex;flex-direction:column;gap:11px}
.sb-top{display:flex;justify-content:space-between;font-size:12px;color:var(--ink);margin-bottom:4px}
.sb-top span:last-child{color:var(--gray);font-weight:600}
.sb-track{height:6px;background:var(--off);border-radius:100px;overflow:hidden}
.sb-fill{height:100%;background:var(--navy);border-radius:100px;transition:width .9s cubic-bezier(.3,.2,.2,1)}
.next-tier{margin-top:16px;background:var(--navy-bg);border-radius:12px;padding:14px 16px;font-size:12.5px;color:var(--navy);line-height:1.6}
.next-tier b{font-weight:700}

/* LOGROS */
.logros-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.logros-grid{grid-template-columns:1fr}}
.logro{border:1.5px solid var(--border);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:flex-start}
.logro.done{border-color:var(--green);background:var(--green-bg)}
.logro-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--off)}
.logro.done .logro-icon{background:var(--white)}
.logro-name{font-size:13px;font-weight:700;color:var(--ink)}
.logro.locked .logro-name{color:var(--gray)}
.logro-desc{font-size:11.5px;color:var(--gray);line-height:1.45;margin-top:2px}
.logro.done .logro-desc{color:var(--green)}

/* LISTAS */
.item-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.item-row:last-child{border-bottom:none;padding-bottom:0}
.item-row:first-of-type{padding-top:0}
.item-main{font-size:13.5px;font-weight:600;color:var(--ink)}
.item-sub{font-size:11.5px;color:var(--gray);margin-top:2px;line-height:1.5}
.item-right{text-align:right;flex-shrink:0}
.item-amount{font-family:'DM Serif Display',serif;font-size:16px;color:var(--ink)}
.badge{display:inline-block;padding:3px 10px;border-radius:100px;font-size:10px;font-weight:700}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-navy{background:var(--navy-bg);color:var(--navy)}
.badge-gold{background:var(--gold-bg);color:var(--gold)}
.stars{color:var(--gold);letter-spacing:1px;font-size:12px}
.stars .off{color:var(--border)}

.empty-mini{text-align:center;padding:22px 10px;color:var(--gray-l);font-size:12.5px;line-height:1.6}

/* GANANCIAS TOTAL */
.total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.total-num{font-family:'DM Serif Display',serif;font-size:30px;color:var(--green)}
.total-lbl{font-size:12px;color:var(--gray)}

/* FORMACION */
.form-progress{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.form-count{font-family:'DM Serif Display',serif;font-size:24px;color:var(--ink);white-space:nowrap}
.form-count span{font-size:13px;color:var(--gray-l);font-family:'DM Sans',sans-serif}
.niveles-dots{display:flex;gap:6px;flex-wrap:wrap}
.nivel-dot{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--off);color:var(--gray-l);border:1.5px solid var(--border)}
.nivel-dot.done{background:var(--navy);color:white;border-color:var(--navy)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:100px;font-size:13px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;border:none;transition:all .15s;text-decoration:none}
.btn-navy{background:var(--navy);color:white}
.btn-navy:hover{background:var(--navy-d)}
.btn-outline{background:var(--white);color:var(--navy);border:1.5px solid var(--border)}
.btn-outline:hover{border-color:var(--navy)}
.btn-row{display:flex;gap:10px;margin-top:14px}
/* ── Escalera de niveles ── */
.nivel-tabla{width:100%;border-collapse:collapse;font-size:12.5px}
.nivel-tabla th{text-align:left;font-size:10px;font-weight:700;color:var(--gray-l);letter-spacing:.08em;text-transform:uppercase;padding:0 10px 8px;border-bottom:1px solid var(--border)}
.nivel-tabla th:last-child,.nivel-tabla td:last-child{text-align:right}
.nivel-tabla td{padding:11px 10px;border-bottom:1px solid var(--border);color:var(--gray)}
.nivel-tabla tr:last-child td{border-bottom:none}
.nivel-tabla tr.actual td{background:var(--navy);color:rgba(255,255,255,.75);font-weight:600}
.nivel-tabla tr.actual td:first-child{border-radius:10px 0 0 10px;color:#fff}
.nivel-tabla tr.actual td:last-child{border-radius:0 10px 10px 0;color:#fff}
.nivel-tabla tr.pasado td{color:var(--gray-l)}
.tarifa-hero{background:var(--navy);border-radius:14px;padding:18px 20px;margin-bottom:16px;color:#fff}
.tarifa-hero-lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.tarifa-hero-num{font-family:'DM Serif Display',serif;font-size:34px;line-height:1.1;margin:2px 0 4px}
.tarifa-hero-sub{font-size:12px;color:rgba(255,255,255,.7);line-height:1.5}
.prog-track{height:6px;background:rgba(255,255,255,.18);border-radius:100px;overflow:hidden;margin-top:12px}
.prog-fill{height:100%;background:#fff;border-radius:100px;transition:width .9s cubic-bezier(.3,.2,.2,1)}
/* ── Próximo logro ── */
.next-logro{background:var(--navy-bg);border:1.5px solid rgba(27,58,92,.18);border-radius:14px;padding:16px;display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
.next-logro-icon{width:42px;height:42px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.next-logro-lbl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);opacity:.65}
.next-logro-name{font-size:14.5px;font-weight:700;color:var(--ink);margin-top:2px}
.next-logro-desc{font-size:12px;color:var(--gray);line-height:1.5;margin-top:3px}
/* ── Bloques de logros ── */
.logro-bloque{font-size:11px;font-weight:700;color:var(--gray-l);letter-spacing:.06em;text-transform:uppercase;margin:18px 0 10px}
.logro-bloque:first-of-type{margin-top:0}
.logro-dep{font-size:10.5px;color:var(--navy);background:var(--navy-bg);border-radius:6px;padding:2px 7px;display:inline-block;margin-top:5px}
/* ── Referidos ── */
.ref-box{background:var(--off);border:1.5px dashed var(--border);border-radius:12px;padding:14px;margin-top:12px}
.ref-link{font-family:monospace;font-size:11.5px;color:var(--navy);word-break:break-all;line-height:1.6}
.ref-stats{display:flex;gap:10px;margin-bottom:12px}
.ref-stat{flex:1;background:var(--navy-bg);border-radius:10px;padding:10px 12px;text-align:center}
.ref-stat-num{font-family:'DM Serif Display',serif;font-size:22px;color:var(--navy);line-height:1.1}
.ref-stat-lbl{font-size:10.5px;color:var(--gray);margin-top:2px}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="tb-logo">Climblight</div>
    <div class="tb-tag">Mi panel de creador</div>
  </div>
  <div class="tb-tag" id="tb-fecha"></div>
</div>

<div class="wrap" id="app">
  <div class="state">
    <div class="spinner"></div>
    Cargando tu panel…
  </div>
</div>

<script>
const SUPABASE_URL = 'https://aaqwtrhjzkxovuvaayft.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Km7IEk6RXzBeOqEY2FkUEw_TTgRHNyL';
const H = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY };
const token = new URLSearchParams(location.search).get('t');

const NIVELES = [
  { nombre: 'Colaborador', min: 0,  max: 2,  pago: 'Producto',  pagoNum: 0,    etiqueta: 'Tarifa inicial'  },
  { nombre: 'Nivel 1',     min: 3,  max: 5,  pago: '$500',      pagoNum: 500,  etiqueta: 'Tarifa inicial'  },
  { nombre: 'Nivel 2',     min: 6,  max: 8,  pago: '$750',      pagoNum: 750,  etiqueta: 'Tarifa estándar' },
  { nombre: 'Nivel 3',     min: 9,  max: 11, pago: '$1,000',    pagoNum: 1000, etiqueta: 'Tarifa estándar' },
  { nombre: 'Embajador',   min: 12, max: 99, pago: '$1,500',    pagoNum: 1500, etiqueta: 'Tarifa premium'  }
];

document.getElementById('tb-fecha').textContent = new Date().toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' });

function showState(html) { document.getElementById('app').innerHTML = '<div class="state">' + html + '</div>'; }

function tierFor(s) {
  if (s >= 90) return { key: 'elite', name: 'Elite Creator', next: null, at: null };
  if (s >= 70) return { key: 'top', name: 'Top Creator', next: 'Elite Creator', at: 90 };
  if (s >= 40) return { key: 'activo', name: 'Creador Activo', next: 'Top Creator', at: 70 };
  return { key: 'base', name: 'Creador Climblight', next: 'Creador Activo', at: 40 };
}

function mesesActivo(f) {
  if (!f) return 0;
  const s = new Date(f); if (isNaN(s)) return 0;
  const n = new Date();
  return Math.max((n.getFullYear() - s.getFullYear()) * 12 + (n.getMonth() - s.getMonth()), 0);
}

function initials(n) {
  if (!n) return '?';
  return n.trim().split(/\s+/).slice(0, 2).map(w => w[0].toUpperCase()).join('');
}

function money(n) { return '$' + Math.round(n).toLocaleString('es-MX') + ' MXN'; }

function ring(score, size, stroke, color) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, off = c * (1 - score / 100), ctr = size / 2;
  return '<div style="position:relative;width:' + size + 'px;height:' + size + 'px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0">' +
    '<svg width="' + size + '" height="' + size + '" style="transform:rotate(-90deg)">' +
    '<circle cx="' + ctr + '" cy="' + ctr + '" r="' + r + '" fill="none" stroke="#EFF4FA" stroke-width="' + stroke + '"/>' +
    '<circle cx="' + ctr + '" cy="' + ctr + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + stroke + '" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + off + '" style="transition:stroke-dashoffset 1s ease"/>' +
    '</svg><span style="position:absolute;font-family:\'DM Serif Display\',serif;font-size:' + Math.round(size * .3) + 'px;color:#111827">' + score + '</span></div>';
}

async function fetchJson(url) {
  try { const r = await fetch(url, { headers: H }); return r.ok ? await r.json() : null; } catch { return null; }
}

async function init() {
  if (!token) { showState('<div class="state-title">Link incompleto</div>Pídele a Climblight tu link personal de creador.'); return; }

  const creators = await fetchJson(SUPABASE_URL + '/rest/v1/Creators?token_panel=eq.' + encodeURIComponent(token) + '&select=*');
  if (!creators) { showState('<div class="state-title">Sin conexión</div>No se pudo cargar tu panel. Intenta de nuevo en un momento.'); return; }
  if (!creators.length) { showState('<div class="state-title">Link no válido</div>Este link ya no funciona. Pídele a Climblight uno nuevo.'); return; }
  const c = creators[0];
  const id = c.id;

  const [ins, cams, sols, convs, refs] = await Promise.all([
    fetchJson(SUPABASE_URL + '/rest/v1/Inscripciones?email=eq.' + encodeURIComponent(c.email || '') + '&status=eq.completado&select=nivel'),
    fetchJson(SUPABASE_URL + '/rest/v1/Campanas?creator_id=eq.' + id + '&status=eq.completada&select=marca,tipo,monto,fecha,calificacion_marca,repetiria_marca,comentario_marca'),
    fetchJson(SUPABASE_URL + '/rest/v1/solicitudes_creador?creator_id=eq.' + id + '&select=marca,tipo_empresa,presupuesto,mensaje,status,fecha&order=id.desc'),
    fetchJson(SUPABASE_URL + '/rest/v1/Convocatorias?status=eq.abierta&select=*&order=id.desc'),
    fetchJson(SUPABASE_URL + '/rest/v1/Creators?referido_por=eq.' + id + '&select=id,status')
  ]);

  let tokenRef = c.token_ref;
  if (!tokenRef) {
    tokenRef = 'r' + Math.random().toString(36).substring(2, 10) + Math.random().toString(36).substring(2, 8);
    try {
      await fetch(SUPABASE_URL + '/rest/v1/Creators?id=eq.' + id, {
        method: 'PATCH',
        headers: Object.assign({}, H, { 'Content-Type': 'application/json', 'Prefer': 'return=minimal' }),
        body: JSON.stringify({ token_ref: tokenRef })
      });
    } catch (e) {}
  }

  render(c, ins || [], cams || [], sols || [], convs || [], refs || [], tokenRef);
}

function render(c, inscripciones, campanas, solicitudes, convocatorias, referidos, tokenRef) {
  const niveles = new Set(inscripciones.map(i => i.nivel));
  const nivelesCount = niveles.size;
  const pagadas = campanas.filter(x => (x.tipo || '').toLowerCase() === 'pagada');
  const marcas = new Set(campanas.map(x => (x.marca || '').toLowerCase().trim()).filter(Boolean));
  const calificaciones = campanas.filter(x => x.calificacion_marca != null);
  const seguidores = parseInt(c.seguidores) || 0;
  const meses = mesesActivo(c.fecha);
  const refsActivos = referidos.filter(r => r.status === 'activo').length;
  const refsPendientes = referidos.length - refsActivos;

  const pFormacion  = Math.min(nivelesCount / 6 * 40, 40);
  const pAntiguedad = Math.min(meses, 20);
  const pCampanas   = Math.min(pagadas.length * 2, 20);
  const pAlcance    = Math.min(seguidores / 1000, 10);
  const pDiversidad = Math.min(marcas.size * 2, 10);
  const score = Math.min(Math.round(pFormacion + pAntiguedad + pCampanas + pAlcance + pDiversidad), 100);
  const tier = tierFor(score);
  const tierColors = { base: '#9CA3AF', activo: '#254E7A', top: '#1B3A5C', elite: '#B8862B' };
  const totalGanado = pagadas.reduce((s, x) => s + (parseFloat(x.monto) || 0), 0);
  const mejorCalif = calificaciones.length ? Math.max(...calificaciones.map(x => x.calificacion_marca)) : 0;

  const LOGROS = [
    { g: 'Tu arranque', icon: '🌱', name: 'Primer paso', done: true, desc: 'Te uniste a la red Climblight', todo: '' },
    { g: 'Tu arranque', icon: '📚', name: 'Formación iniciada', done: nivelesCount >= 1, desc: 'Completaste tu primer nivel', todo: 'Completa tu primer nivel de formación' },
    { g: 'Tu arranque', icon: '✦', name: 'Perfil activo', done: c.status === 'activo', desc: 'Apareces en el catálogo público', todo: 'Climblight activa tu perfil tras revisarlo', dep: 'Lo activa Climblight' },
    { g: 'Tu trabajo', icon: '💰', name: 'Primera campaña', done: pagadas.length >= 1, desc: 'Completaste tu primera campaña pagada', todo: 'Completa tu primera campaña pagada', dep: 'Necesita una marca' },
    { g: 'Tu trabajo', icon: '🤝', name: 'Multi-marca', done: marcas.size >= 2, desc: 'Trabajaste con ' + marcas.size + ' marcas distintas', todo: 'Trabaja con 2 marcas distintas (llevas ' + marcas.size + ')', dep: 'Necesita una marca' },
    { g: 'Tu trabajo', icon: '🔥', name: 'En racha', done: pagadas.length >= 3, desc: 'Llevas ' + pagadas.length + ' campañas pagadas', todo: 'Completa 3 campañas pagadas (llevas ' + pagadas.length + ')', dep: 'Necesita una marca' },
    { g: 'Tu trabajo', icon: '⭐', name: 'Cinco estrellas', done: mejorCalif >= 5, desc: 'Una marca te calificó con 5 estrellas', todo: 'Recibe una calificación de 5 estrellas', dep: 'Lo califica la marca' },
    { g: 'Tu trabajo', icon: '🏆', name: 'Profesional', done: pagadas.length >= 5, desc: 'Llevas ' + pagadas.length + ' campañas pagadas', todo: 'Completa 5 campañas pagadas (llevas ' + pagadas.length + ')', dep: 'Necesita una marca' },
    { g: 'Tu crecimiento', icon: '🎓', name: 'Graduado Climblight', done: nivelesCount >= 6, desc: 'Completaste los 6 niveles', todo: 'Completa los 6 niveles (llevas ' + nivelesCount + ')' },
    { g: 'Tu crecimiento', icon: '📈', name: 'Alcance 5K', done: seguidores >= 5000, desc: 'Superaste los 5,000 seguidores', todo: 'Llega a 5,000 seguidores (llevas ' + seguidores.toLocaleString('es-MX') + ')' },
    { g: 'Tu crecimiento', icon: '⏳', name: 'Constante', done: meses >= 3 && pagadas.length >= 6, desc: 'Llevas ' + meses + ' meses y ' + pagadas.length + ' campañas', todo: '3 meses activo + 6 campañas (llevas ' + meses + ' meses, ' + pagadas.length + ' campañas)' },
    { g: 'Tu crecimiento', icon: '🏅', name: 'Embajador', done: refsActivos >= 3, desc: 'Trajiste ' + refsActivos + ' creadores a la red', todo: 'Refiere 3 creadores que se activen (llevas ' + refsActivos + ')' }
  ];

  const desbloqueados = LOGROS.filter(l => l.done).length;
  const nivelIdx = NIVELES.findIndex(n => desbloqueados >= n.min && desbloqueados <= n.max);
  const nivelActual = NIVELES[nivelIdx];
  const nivelSig = NIVELES[nivelIdx + 1] || null;
  const faltanLogros = nivelSig ? nivelSig.min - desbloqueados : 0;
  const progPct = nivelSig
    ? Math.min((desbloqueados - nivelActual.min) / (nivelSig.min - nivelActual.min) * 100, 100)
    : 100;

  let nextTierHtml = '';
  if (tier.next) {
    const faltan = tier.at - score;
    const tips = [];
    if (pFormacion < 40) tips.push('completar niveles de formación');
    if (pCampanas < 20) tips.push('hacer campañas pagadas (+2 pts cada una)');
    if (pAlcance < 10) tips.push('crecer tus seguidores (+1 pt por cada 1,000)');
    if (pDiversidad < 10) tips.push('trabajar con marcas nuevas (+2 pts por marca)');
    nextTierHtml = '<div class="next-tier">Te faltan <b>' + faltan + ' puntos</b> para ser <b>' + tier.next + '</b>. Tus caminos más rápidos: ' + tips.slice(0, 2).join(' y ') + '.</div>';
  } else {
    nextTierHtml = '<div class="next-tier">Estás en la cima: <b>Elite Creator</b>. Mantén tu ritmo de campañas para conservarlo.</div>';
  }

  const proximo = LOGROS.find(l => !l.done);
  const proximoHtml = proximo
    ? '<div class="next-logro"><div class="next-logro-icon">' + proximo.icon + '</div>' +
      '<div><div class="next-logro-lbl">Tu siguiente logro</div>' +
      '<div class="next-logro-name">' + proximo.name + '</div>' +
      '<div class="next-logro-desc">' + proximo.todo + '</div>' +
      (proximo.dep ? '<span class="logro-dep">' + proximo.dep + '</span>' : '') + '</div></div>'
    : '<div class="next-logro"><div class="next-logro-icon">🏅</div><div><div class="next-logro-lbl">Completado</div>' +
      '<div class="next-logro-name">Desbloqueaste los 12 logros</div>' +
      '<div class="next-logro-desc">Estás en el máximo nivel de tarifa de Climblight.</div></div></div>';

  let logrosHtml = '';
  ['Tu arranque', 'Tu trabajo', 'Tu crecimiento'].forEach(function(bloque) {
    logrosHtml += '<div class="logro-bloque">' + bloque + '</div><div class="logros-grid">';
    LOGROS.filter(l => l.g === bloque).forEach(function(l) {
      logrosHtml += '<div class="logro ' + (l.done ? 'done' : 'locked') + '">' +
        '<div class="logro-icon">' + (l.done ? l.icon : '🔒') + '</div>' +
        '<div><div class="logro-name">' + l.name + '</div>' +
        '<div class="logro-desc">' + (l.done ? l.desc : l.todo) + '</div>' +
        (!l.done && l.dep ? '<span class="logro-dep">' + l.dep + '</span>' : '') + '</div></div>';
    });
    logrosHtml += '</div>';
  });

  let tablaHtml = '<table class="nivel-tabla"><thead><tr><th>Nivel</th><th>Logros</th><th>Por campaña</th></tr></thead><tbody>';
  NIVELES.forEach(function(n, i) {
    const cls = i === nivelIdx ? 'actual' : (i < nivelIdx ? 'pasado' : '');
    const rango = n.max >= 99 ? n.min + '+' : n.min + '–' + n.max;
    tablaHtml += '<tr class="' + cls + '"><td>' + n.nombre + '</td><td>' + rango + '</td><td>' + n.pago + '</td></tr>';
  });
  tablaHtml += '</tbody></table>';

  const tarifaHtml = '<div class="tarifa-hero">' +
    '<div class="tarifa-hero-lbl">Tu tarifa por campaña</div>' +
    '<div class="tarifa-hero-num">' + (nivelActual.pagoNum ? money(nivelActual.pagoNum) : 'Producto o servicio') + '</div>' +
    '<div class="tarifa-hero-sub">' + nivelActual.nombre + ' · ' + desbloqueados + ' de 12 logros' +
    (nivelSig ? ' · te ' + (faltanLogros === 1 ? 'falta 1 logro' : 'faltan ' + faltanLogros + ' logros') + ' para ' + nivelSig.nombre + ' (' + nivelSig.pago + ')' : '') + '</div>' +
    '<div class="prog-track"><div class="prog-fill" data-pct="' + progPct + '" style="width:0"></div></div></div>';

  const refLink = location.origin + '/index.html?ref=' + tokenRef + '#registro';
  const refHtml = '<div class="ref-stats">' +
      '<div class="ref-stat"><div class="ref-stat-num">' + refsActivos + '</div><div class="ref-stat-lbl">Activos</div></div>' +
      '<div class="ref-stat"><div class="ref-stat-num">' + refsPendientes + '</div><div class="ref-stat-lbl">En revisión</div></div>' +
      '<div class="ref-stat"><div class="ref-stat-num">' + Math.max(3 - refsActivos, 0) + '</div><div class="ref-stat-lbl">Para Embajador</div></div>' +
    '</div>' +
    '<div class="item-sub" style="margin-bottom:0">Comparte tu link — cuando 3 de tus invitados se activen, desbloqueas Embajador.</div>' +
    '<div class="ref-box"><div class="ref-link" id="ref-link">' + refLink + '</div></div>' +
    '<button class="btn btn-navy" style="margin-top:10px" onclick="copiarRef(\'' + refLink + '\', this)">🔗 Copiar mi link de invitación</button>';

  const convsHtml = convocatorias.length
    ? convocatorias.map(v =>
        '<div class="item-row"><div><div class="item-main">' + (v.titulo || v.marca || 'Convocatoria') + '</div>' +
        '<div class="item-sub">' + [v.marca, v.descripcion].filter(Boolean).join(' · ') + '</div></div>' +
        '<div class="item-right">' + (v.pago ? '<div class="item-amount">' + v.pago + '</div>' : '') + '<span class="badge badge-green">Abierta</span></div></div>').join('')
    : '<div class="empty-mini">No hay convocatorias abiertas por ahora.<br>Cuando una marca lance una campaña, aparecerá aquí.</div>';

  const solsHtml = solicitudes.length
    ? solicitudes.map(s =>
        '<div class="item-row"><div><div class="item-main">' + (s.marca || 'Marca') + '</div>' +
        '<div class="item-sub">' + [s.tipo_empresa === 'blusym' ? '🎬 Empresa creativa' : '🏪 Negocio local', s.presupuesto].filter(Boolean).join(' · ') + '</div></div>' +
        '<div class="item-right"><span class="badge badge-navy">Preguntó por ti</span></div></div>').join('')
    : '<div class="empty-mini">Aún no hay marcas preguntando por ti.<br>Sube tu Score y completa tu formación para destacar en el catálogo.</div>';

  const gananciasRows = pagadas.length
    ? pagadas.map(x => {
        const stars = x.calificacion_marca != null
          ? '<div class="stars">' + '★'.repeat(x.calificacion_marca) + '<span class="off">' + '★'.repeat(5 - x.calificacion_marca) + '</span></div>' +
            (x.comentario_marca ? '<div class="item-sub">"' + x.comentario_marca + '"</div>' : '')
          : '';
        return '<div class="item-row"><div><div class="item-main">' + (x.marca || 'Campaña') + '</div>' + stars + '</div>' +
          '<div class="item-right"><div class="item-amount">' + money(parseFloat(x.monto) || 0) + '</div></div></div>';
      }).join('')
    : '<div class="empty-mini">Todavía no tienes campañas pagadas registradas.<br>Tu primera campaña aparecerá aquí.</div>';

  const nivelesDots = [1,2,3,4,5,6].map(n => {
    const done = [...niveles].some(x => String(x).includes(n));
    return '<div class="nivel-dot' + (done ? ' done' : '') + '">' + n + '</div>';
  }).join('');

  document.getElementById('app').innerHTML =
    '<div class="card hero-card">' +
      '<div class="hero-photo">' + (c.foto_url ? '<img src="' + c.foto_url + '">' : initials(c.nombre)) + '</div>' +
      '<div><div class="hero-name">' + (c.nombre || 'Creador') + '</div>' +
      '<div class="hero-meta">' + (c.ciudad || '—') + ' · ' + (c.nicho || '—') + '</div>' +
      '<span class="tier-pill tier-' + tier.key + '">' + tier.name + '</span></div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-label">Mi nivel y tarifa</div>' +
      tarifaHtml + tablaHtml +
    '</div>' +

    '<div class="card">' +
      '<div class="card-label">Logros · ' + desbloqueados + ' de 12 desbloqueados</div>' +
      proximoHtml + logrosHtml +
    '</div>' +

    '<div class="card">' +
      '<div class="card-label">Invita creadores</div>' + refHtml +
    '</div>' +

    '<div class="card">' +
      '<div class="card-label">Mi Climblight Score</div>' +
      '<div class="score-flex">' + ring(score, 88, 8, tierColors[tier.key]) +
        '<div><div class="score-txt-tier">' + tier.name + '</div>' +
        '<div class="score-txt-sub">' + score + ' de 100 puntos</div>' +
        '<div class="item-sub" style="margin-top:4px">Lo que ven las marcas</div></div></div>' +
      '<div class="sb-rows">' +
        sbRow('Formación', pFormacion, 40) +
        sbRow('Antigüedad activa', pAntiguedad, 20) +
        sbRow('Campañas pagadas', pCampanas, 20) +
        sbRow('Alcance', pAlcance, 10) +
        sbRow('Diversidad de marcas', pDiversidad, 10) +
      '</div>' + nextTierHtml +
    '</div>' +

    '<div class="card">' +
      '<div class="card-label">Convocatorias abiertas</div>' + convsHtml +
    '</div>' +

    '<div class="card">' +
      '<div class="card-label">Marcas interesadas en mí</div>' + solsHtml +
    '</div>' +

    '<div class="card">' +
      '<div class="card-label">Mis ganancias</div>' +
      '<div class="total-row"><div class="total-lbl">Total ganado con Climblight</div>' +
      '<div class="total-num">' + money(totalGanado) + '</div></div>' + gananciasRows +
    '</div>' +

    '<div class="card">' +
      '<div class="card-label">Mi formación · ' + nivelesCount + ' de 6 niveles</div>' +
      '<div class="form-progress"><div class="form-count">' + nivelesCount + '<span>/6</span></div>' +
      '<div class="niveles-dots">' + nivelesDots + '</div></div>' +
      '<a class="btn btn-outline" href="index.html#cursos">📚 Inscribirme al siguiente nivel</a>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-label">Mi gafete público</div>' +
      '<div class="item-sub" style="margin-bottom:4px">Tu tarjeta de presentación con Score verificado — compártela con cualquier marca.</div>' +
      '<div class="btn-row"><a class="btn btn-navy" href="climblight-perfil.html?id=' + c.id + '">✦ Ver mi gafete</a></div>' +
    '</div>';

  requestAnimationFrame(() => {
    document.querySelectorAll('.sb-fill,.prog-fill').forEach(el => { el.style.width = el.dataset.pct + '%'; });
  });
}

function copiarRef(link, btn) {
  navigator.clipboard.writeText(link).then(function() {
    const original = btn.textContent;
    btn.textContent = '✓ Link copiado';
    setTimeout(function() { btn.textContent = original; }, 2000);
  });
}

function sbRow(label, val, max) {
  return '<div><div class="sb-top"><span>' + label + '</span><span>' + Math.round(val) + ' / ' + max + '</span></div>' +
    '<div class="sb-track"><div class="sb-fill" data-pct="' + Math.min(val / max * 100, 100) + '" style="width:0"></div></div></div>';
}

init();
</script>
</body>
</html>
